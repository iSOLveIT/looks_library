<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Looks Library – Resolve node notes</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f2f0;--panel:#fff;--ink:#18191b;--mute:#62666d;--line:#d9dad7;--acc:#0b7a75;--accsoft:#dcefed;--node:#f7f7f5;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141516;--panel:#1c1d1f;--ink:#ececea;--mute:#9a9ea5;--line:#2e3033;--acc:#4fd1c5;--accsoft:#163230;--node:#232527}}
:root[data-theme="dark"]{--bg:#141516;--panel:#1c1d1f;--ink:#ececea;--mute:#9a9ea5;--line:#2e3033;--acc:#4fd1c5;--accsoft:#163230;--node:#232527}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.55 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
.app{display:grid;grid-template-columns:340px 1fr;min-height:100vh;max-width:1200px;margin:0 auto}
aside{border-right:1px solid var(--line);padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto;align-self:start}
h1{font-size:22px;font-weight:700;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--mute);margin:0 0 14px;font-size:13px}
input[type=search]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{border:1px solid var(--line);background:transparent;color:var(--mute);border-radius:99px;padding:3px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.count{font-size:13px;color:var(--mute);margin:4px 0 8px}
.item{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:0;margin-bottom:8px;cursor:pointer;color:inherit;font:inherit;overflow:hidden}
.item[aria-current=true]{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.item .sw{height:6px;display:block}
.item b{display:block;padding:9px 12px 0;font-weight:600}
.item span.r{display:block;padding:0 12px 9px;font-size:13px;color:var(--mute)}
main{padding:28px 32px 60px}
.band{height:84px;border-radius:10px;margin-bottom:18px;display:flex;overflow:hidden}
.band i{flex:1;display:block}
h2{font-size:30px;line-height:1.15;margin:0 0 4px;letter-spacing:-.02em}
.ref{color:var(--mute);margin:0 0 20px}
.driver{background:var(--accsoft);border-left:4px solid var(--acc);padding:12px 16px;border-radius:0 8px 8px 0;margin-bottom:22px;max-width:680px}
.driver b{display:block;margin-bottom:2px}
h3{font-size:16px;margin:26px 0 8px}
p.how{max-width:680px;margin:0}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.tags span{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:1px 7px}
.tree{list-style:none;margin:10px 0 0;padding:0;max-width:680px}
.node{position:relative;padding-left:44px;padding-bottom:14px}
.node:not(:last-child)::before{content:"";position:absolute;left:15px;top:32px;bottom:0;width:2px;background:var(--line)}
.node button{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;background:var(--node);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.node button:focus-visible{outline:2px solid var(--acc)}
.node .n{position:absolute;left:0;top:4px;width:32px;height:32px;border-radius:50%;background:var(--panel);border:2px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:13px}
.node strong{display:block;font-weight:600}
.node em{font-style:normal;color:var(--mute);display:block;font-size:14px;margin-top:2px}
.node.done .n{background:var(--acc);border-color:var(--acc);color:var(--bg)}
.node.done strong{text-decoration:line-through;color:var(--mute)}
.prog{font-size:13px;color:var(--mute)}
.empty{color:var(--mute);padding:20px 0}
@media (max-width:820px){.app{grid-template-columns:1fr}aside{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}main{padding:20px 16px 48px}h2{font-size:25px}}
</style>
</head>
<body>
<div class="app">
<aside>
<h1>Looks Library</h1>
<p class="sub">Search a look, then follow its DaVinci Resolve node tree.</p>
<input id="q" type="search" placeholder="Search looks, films, or techniques" aria-label="Search looks">
<div class="chips" id="chips"></div>
<div class="count" id="count"></div>
<div id="list"></div>
</aside>
<main id="detail" aria-live="polite"></main>
</div>
<script>
var L=[
{n:"Teal & Orange",r:"Blockbusters, Transformers, Mad Max",t:["cinematic","color contrast"],sw:["#0f4a52","#6c7f7a","#e8a36b"],f:"Complementary hue separation. Orange skin pops against teal surroundings.",h:"Push shadows and mids toward teal and highlights toward orange, while keeping skin on the skin-tone line.",
nodes:[["Balance","Fix exposure and white balance first. Check skin sits near the skin-tone line on the vectorscope."],["Contrast","Add a gentle S-curve in Curves, or raise Contrast to about 1.15 with the pivot near 0.435."],["Split the hues","Log wheels: nudge the Shadow wheel toward teal and the Highlight wheel toward orange. Small moves go a long way."],["Protect skin","Qualify skin with the HSL Qualifier, then in a separate node pull it back to the skin-tone line."],["Clean up","Hue vs Sat: lower stray greens and magentas. Optional light grain on the last node."]]},
{n:"Bleach Bypass",r:"Saving Private Ryan, Se7en",t:["cinematic","gritty","desaturated"],sw:["#1c1d1f","#6d7073","#d8d8d4"],f:"Low saturation combined with high contrast.",h:"Silver-retention look: strip color, crush contrast, keep some color underneath.",
nodes:[["Balance","Neutral base with a healthy exposure."],["Desaturate","On a new node, drop Saturation to 30–50%."],["Parallel desat layer","Add a parallel node, fully desaturate it, raise Contrast hard, then Layer Mixer set to Overlay or Soft Light at 40–70% opacity."],["Highlight punch","Curves: lift the top end a touch and deepen the lower mids."],["Texture","Add Film Grain (OFX) for a rough, chemical feel."]]},
{n:"Filmic / Print Emulation",r:"Classic cinema, Kodak 2383",t:["cinematic","film","natural"],sw:["#1d2a30","#7a766b","#efe3cb"],f:"Tone curve and highlight roll-off. Soft, dense highlights are the film feel.",h:"Convert to a display space through a film print curve, then add film texture.",
nodes:[["Input transform","Color Space Transform (or Color Management) from camera log to a working space."],["Exposure and balance","Set mid-grey and white balance on the first correction node."],["Film curve","Apply the Film Look Creator OFX or a Kodak 2383 print LUT. Reduce its strength if it feels heavy."],["Halation","Add Halation OFX: low threshold, warm red-orange tint, subtle."],["Grain","Add Film Grain OFX matched to the stock, kept faint."]]},
{n:"Day-for-Night",r:"Mad Max: Fury Road",t:["cinematic","stylized","low light"],sw:["#0a1424","#2c4468","#9db6d6"],f:"Exposure level and color temperature shift.",h:"Underexpose, cool the white balance, and darken the sky to sell moonlight.",
nodes:[["Base balance","Normalize the daylight shot first."],["Darken","Lower Gamma and Gain by about a stop. Keep blacks anchored."],["Go blue","Temp down and Tint slightly magenta, or push Gamma toward blue."],["Sky window","Power Window or Qualifier on the sky, then darken it heavily. Add a soft gradient window across the top."],["Moon highlights","Qualify highlights and tint them cool white. Lower overall saturation."]]},
{n:"Cross Process",r:"Fashion, music videos, 90s indie",t:["stylized","color contrast","vintage"],sw:["#4a1d5e","#3f8f7a","#f0e07a"],f:"Opposing color casts in highlights vs shadows.",h:"Per-channel curve moves with high contrast and saturation.",
nodes:[["Base","Neutral correction."],["Channel curves","Curves, Custom mode, per channel: lift Red and Green in the highlights, push Blue up in the shadows."],["Contrast","Steepen the overall S-curve."],["Saturation","Raise Saturation to about 60–70."],["Check skin","Use a qualifier to tame any sickly skin."]]},
{n:"Faded / Matte",r:"Indie films, Instagram-style",t:["stylized","nostalgic","soft"],sw:["#4b4f57","#8c8f94","#e4e2dc"],f:"Raised black level. A low contrast ratio gives the washed feel.",h:"Lift blacks, trim highlights, reduce saturation slightly.",
nodes:[["Base","Neutral correction."],["Lift blacks","Raise Lift, or pull the bottom-left curve point up until blacks sit around 10–15% on the waveform."],["Trim highlights","Pull the top-right curve point down a little."],["Mute color","Saturation to about 80%."],["Tint","Slight warm or green cast in the shadows for character."]]},
{n:"Neo-Noir / Low-Key",r:"Blade Runner, Sin City",t:["cinematic","dark","contrast"],sw:["#050507","#2a2d3a","#d9c9a3"],f:"Contrast ratio and shadow depth.",h:"Crush shadows, hold highlights tight, isolate pools of light.",
nodes:[["Base","Neutral correction."],["Crush shadows","Drop Lift and Gamma, set blacks to 0–2%."],["Window the light","Power Windows around practicals and faces, soft edges, brightened and the rest darkened."],["Control color","Saturation to about 70–80 with a single accent hue."],["Haze","Optional Glow OFX on highlights for atmosphere."]]},
{n:"Pastel / Whimsical",r:"Wes Anderson",t:["stylized","high key","palette"],sw:["#f3c6c9","#f5e2a8","#a9cfe0"],f:"Controlled palette. Selective hue and saturation management on high-key exposure.",h:"Brighten, then curate which hues survive.",
nodes:[["Exposure","Lift Gain and Gamma for a bright, flat image."],["Contrast","Keep it low and even."],["Hue vs Sat","Boost pinks, yellows and soft blues. Mute everything else."],["Hue vs Hue","Shift stray colors toward the palette."],["Warm balance","Add a slight warm tint to the highlights."]]},
{n:"Cyberpunk / Neon",r:"Blade Runner 2049, Cyberpunk 2077",t:["stylized","dark","neon"],sw:["#0b0620","#d11fa8","#22e3e8"],f:"Saturated accent colors against dark exposure.",h:"Dark base, magenta and cyan split, glowing light sources.",
nodes:[["Dark base","Lower Gamma and keep blacks rich."],["Split color","Log wheels: Shadows toward blue-cyan, Highlights toward magenta."],["Isolate lights","Qualify bright sources and raise their saturation."],["Glow","Glow OFX on a parallel node, blended Screen at 30–50%."],["Skin check","Keep faces readable but allow colored light spill."]]},
{n:"Monochromatic Cast",r:"The Matrix, Blade Runner 2049",t:["stylized","single hue"],sw:["#0a2a14","#3d7a4c","#b8e0b0"],f:"A single dominant hue defines the world.",h:"Push one hue into mids and shadows.",
nodes:[["Base","Neutral correction."],["Global cast","Offset or Gamma wheel toward the chosen hue."],["Restore range","Re-balance contrast so highlights stay controlled."],["Skin","Qualify skin and partially restore it, or let it take the cast."],["Texture","Add grain to unify the image."]]},
{n:"Cold Desaturated Thriller",r:"Fincher: Gone Girl, Zodiac",t:["cinematic","desaturated","dark"],sw:["#1a2420","#5d6b5e","#b9bfae"],f:"Desaturation plus a consistent color cast.",h:"Slightly underexposed, cool-green mids, restrained color.",
nodes:[["Base","Slightly underexpose."],["Color cast","Gamma wheel toward green-yellow or cool."],["Desaturate","Saturation to about 60–70."],["Skin","Keep skin neutral to slightly sickly."],["Contrast","Gentle S-curve, no crushed blacks."]]},
{n:"Golden Hour / Warm Glow",r:"Romance, nostalgic scenes",t:["natural","warm","soft"],sw:["#3a3045","#d8924a","#ffe2a8"],f:"Color temperature, especially warm highlights.",h:"Warm the highlights, keep shadows neutral or slightly cool.",
nodes:[["Base","Neutral white balance."],["Warm highlights","Log Highlight wheel toward amber."],["Cool shadows","Optional Shadow wheel slightly blue for depth."],["Bloom","Glow or blurred highlight layer blended Screen at 20%."],["Skin","Check skin stays natural, not orange."]]},
{n:"Vintage 70s Film",r:"The Godfather, Taxi Driver",t:["vintage","film","warm"],sw:["#3b2c1e","#9b7a4d","#e3caa0"],f:"Grain and halation with warm, faded tones.",h:"Warm mids, lifted blacks, muted greens, heavy film texture.",
nodes:[["Base","Neutral correction."],["Warm and fade","Mids warm, Lift raised slightly, Contrast lowered."],["Mute greens","Hue vs Sat: lower greens, nudge toward yellow."],["Halation","Halation OFX, warm tint."],["Grain and weave","Film Grain OFX at a visible level. Optional Transform node for subtle gate weave."]]},
{n:"Black & White",r:"Schindler’s List, Raging Bull",t:["classic","monochrome"],sw:["#000000","#808080","#ffffff"],f:"Luminance mapping through channel mixing.",h:"Use the channel mixer to decide how colors turn to grey.",
nodes:[["Base","Neutral correction."],["Channel mixer","Open Color Page Channel Mixer, check Monochrome. Raise Red for lighter skin, lower Blue for darker skies."],["Contrast","S-curve, deep blacks, bright whites."],["Local contrast","Optional Mid/Detail control or window shaping."],["Grain","Film Grain OFX to finish."]]},
{n:"Dreamy / Glow",r:"Romance, fantasy, music videos",t:["soft","stylized","diffusion"],sw:["#5a4a6e","#c8a8c4","#fff1ea"],f:"Highlight diffusion. Light bleeds into the shadows.",h:"Blur a highlight-only layer and blend it back.",
nodes:[["Base","Neutral correction."],["Highlight key","Qualifier or Luma curve to isolate highlights."],["Blur","Gaussian Blur or Glow OFX on that layer."],["Blend","Layer Mixer in Screen or Add at 30–60%."],["Lift blacks","Raise Lift slightly for softness."]]},
{n:"Clean Natural / Neutral",r:"Documentary, commercial, corporate",t:["natural","clean"],sw:["#2a2d31","#8a8782","#f1eee7"],f:"Exposure and white balance accuracy.",h:"Correct, then a gentle S-curve.",
nodes:[["Input transform","CST to the working space."],["Balance","White balance, exposure, then match shots."],["Contrast","Gentle S-curve."],["Skin tones","Vectorscope skin check, tweak with Hue vs Hue if needed."],["Saturation","Keep it near 50 and natural."]]}
];
var ALLT=[];L.forEach(function(x){x.t.forEach(function(t){if(ALLT.indexOf(t)<0)ALLT.push(t)})});
var q=document.getElementById("q"),list=document.getElementById("list"),det=document.getElementById("detail"),cnt=document.getElementById("count"),chips=document.getElementById("chips");
var sel=0,tag="",done={};
function bandBg(s){return s.map(function(c){return '<i style="background:'+c+'"></i>'}).join("")}
function matches(x){var s=q.value.toLowerCase().trim();if(tag&&x.t.indexOf(tag)<0)return false;if(!s)return true;
var hay=(x.n+" "+x.r+" "+x.t.join(" ")+" "+x.f+" "+x.h+" "+x.nodes.map(function(n){return n[0]+" "+n[1]}).join(" ")).toLowerCase();return s.split(/\s+/).every(function(w){return hay.indexOf(w)>=0})}
function renderChips(){chips.innerHTML=ALLT.map(function(t){return '<button class="chip" aria-pressed="'+(tag===t)+'" data-t="'+t+'">'+t+'</button>'}).join("");
Array.prototype.forEach.call(chips.children,function(b){b.onclick=function(){tag=(tag===b.dataset.t)?"":b.dataset.t;renderChips();renderList()}})}
function renderList(){var r=[];L.forEach(function(x,i){if(matches(x))r.push(i)});cnt.textContent=r.length+" of "+L.length+" looks";
if(r.length&&r.indexOf(sel)<0){sel=r[0];renderDetail()}
list.innerHTML=r.length?r.map(function(i){var x=L[i];return '<button class="item" data-i="'+i+'" aria-current="'+(i===sel)+'"><span class="sw" style="background:linear-gradient(90deg,'+x.sw.join(",")+')"></span><b>'+x.n+'</b><span class="r">'+x.r+'</span></button>'}).join(""):'<div class="empty">No looks match. Try a film title, a hue, or a Resolve tool like “qualifier”.</div>';
Array.prototype.forEach.call(list.querySelectorAll(".item"),function(b){b.onclick=function(){sel=+b.dataset.i;renderList();renderDetail();if(innerWidth<=820)det.scrollIntoView({behavior:"smooth"})}})}
function renderDetail(){var x=L[sel];if(!x){det.innerHTML="";return}var d=done[sel]||{},c=Object.keys(d).filter(function(k){return d[k]}).length;
det.innerHTML='<div class="band">'+bandBg(x.sw)+'</div><h2>'+x.n+'</h2><p class="ref">'+x.r+'</p><div class="driver"><b>Main contributing factor</b>'+x.f+'</div><h3>How to achieve it</h3><p class="how">'+x.h+'</p><div class="tags">'+x.t.map(function(t){return '<span>'+t+'</span>'}).join("")+'</div><h3>DaVinci Resolve node tree</h3><div class="prog">'+c+' of '+x.nodes.length+' nodes done. Tap a node to check it off.</div><ol class="tree">'+x.nodes.map(function(n,i){return '<li class="node'+(d[i]?" done":"")+'"><span class="n">'+(i+1)+'</span><button data-k="'+i+'" aria-pressed="'+!!d[i]+'"><strong>'+n[0]+'</strong><em>'+n[1]+'</em></button></li>'}).join("")+'</ol>';
Array.prototype.forEach.call(det.querySelectorAll(".node button"),function(b){b.onclick=function(){done[sel]=done[sel]||{};done[sel][b.dataset.k]=!done[sel][b.dataset.k];renderDetail()}})}
q.oninput=renderList;
document.addEventListener("keydown",function(e){if(e.key==="/"&&document.activeElement!==q){e.preventDefault();q.focus()}});
renderChips();renderList();renderDetail();
</script>
</body>
</html>
